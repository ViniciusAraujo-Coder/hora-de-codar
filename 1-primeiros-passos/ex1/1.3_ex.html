<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execicio 1.3</title>
    <script>
        var nome = prompt("Digite seu nome: ")
        var idade = prompt("Digite sua idade: ")
        
        document.writeln(`Olá ${nome}, você tem ${idade} anos!<br>`)
        
        document.writeln(`Seu nome em letras maiúsculas fica assim: ${nome.toUpperCase()}<br>`)
        document.writeln(`E tem ${nome.length} letras.<br>`)

        document.writeln(`Tenho certeza que você esta muito feliz em ser palmeirense, ${nome}`)

        
    </script>
</head>
<body>
    
</body>
</html>
