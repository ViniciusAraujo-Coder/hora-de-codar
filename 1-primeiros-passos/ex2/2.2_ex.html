<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execicio 2.2</title>
</head>
<script>

    //2.2. Leia um valor e diga se ele é positivo, negativo ou zero.

    var num1 = Number(prompt(`Digite o primeiro número: `))

    if (num1 > 0){
        alert(`O ${num1} é positivo`)
    }
    else if (num1 < 0){
        alert(`O ${num1} é negativo`)
    }
    else {
        alert(`O valor é igual a 0`)
    }

</script>

</body>
</html>
