<script>
    //2.3. Leia 3 valores diferentes e mostre o maior.

    var num1 = Number(prompt(`Digite o primeiro número: `))
    var num2 = Number(prompt(`Digite o segundo número: `))
    var num3 = Number(prompt(`Digite o terceiro número: `))

    if (num1 > num2 && num1 > num3){
        alert(`O valor ${num1} é o maior entre ${num2} e ${num3}`)
    }

    else if (num2 > num1 && num2 > num3){
        alert(`O valor ${num2} é o maior entre ${num1} e ${num3}`)
    }

    else if (num3 > num1 && num3 > num2){
        alert(`O valor ${num3} é o maior entre ${num1} e ${num2}`)
    }

</script>
