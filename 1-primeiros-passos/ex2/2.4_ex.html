<!-- FALTA TERMINAR ESSE -->
<script>

    var n1 = Number(prompt(`Digite o primeiro número: `))
    var n2 = Number(prompt(`Digite o segundo número: `))
    var n3 = Number(prompt(`Digite o terceiro número: `))
    var n4 = Number(prompt(`Digite o q número: `))
    var n5 = Number(prompt(`Digite o quinto número: `))
    var n6 = Number(prompt(`Digite o sexto número: `))

    var media = ((n1+n2+n3+n4+n5+n6)/6)

    document.write(`Os números digitados foram: ${n1}, ${n2}, ${n3}, ${n4}, ${n5} e ${n6}. <br>`)

    document.write(`A média dos números digitados é: ${media.toFixed(2)}`)

</script>
