    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>

    // 2.4. Leia 3 valores diferentes e mostre a soma dos 2 maiores.

    var n1 = Number(prompt(`Digite o primeiro número: `))
    var n2 = Number(prompt(`Digite o segundo número: `))
    var n3 = Number(prompt(`Digite o terceiro número: `))

    var maior1;
    var maior2;
    var soma;

    if (n1 < n2 && n1 < n3) {
        maior1 = n2
        maior2 = n3
        soma = n2 + n3
    }

    else if (n2 < n1 && n2 < n3) {
        maior1 = n1
        maior2 = n3
        soma = n1 + n3
    }

    else {
        maior1 = n1
        maior2 = n2
        soma = n1 + n2
    }

    document.write(`Os dois maiores números digitados foram: ${maior1} e ${maior2}. <br>`)
    document.write(`A soma dos dois maiores números é: ${soma}`)

</script>
