<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execicio 2.5</title>
</head>
<script>

    var n1 = Number(prompt(`Digite o primeiro número: `))
    var n2 = Number(prompt(`Digite o segundo número: `))
    var n3 = Number(prompt(`Digite o terceiro número: `))

    var n4 = Number(prompt(`Digite o terceiro número: `))

    var n5 = Number(prompt(`Digite o quarto número: `))

    var n6 = Number(prompt(`Digite o quinto número: `))

    var media = (n1 + n2 + n3 + n4 + n5 + n6) / 6

    document.write(`A média aritmética dos seguintes números: ${n1}, ${n2}, ${n3}, ${n4}, ${n5}, ${n6}. 
    <br>É: ${media.toFixed(2)}.`)

</script>

</body>
</html>
