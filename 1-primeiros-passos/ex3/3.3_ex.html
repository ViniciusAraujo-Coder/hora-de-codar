<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3.3</title>
    <script>
        //3.3. Calcule e exiba a média aritmética dos números inteiros de 15 a 100 (inclusive).

        let soma = 0
        let contador = 0
        
        for(let i = 15; i <= 100; i+=1){
            soma = soma + i
            contador = contador += 1
        }
         
        document.write(`O valor somado é igual à ${soma}<br>`)
        document.write(`Foram somados ${contador} números de (15 a 100)<br>`)
        document.write(`A média aritimética é ${soma/contador}<br>`)
        

        





    </script>
</head>
