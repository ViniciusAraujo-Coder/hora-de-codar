<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Compras</title>
</head>
<script>

    let frutas = ["Mamão", "Banana", "Carambola", "Morango"]

    while(true) {

        alert(`Temos ${frutas.length} frutas disponíveis: ${frutas}`)

        let fruta = prompt(`Que fruta você deseja? `).toLocaleUpperCase().trim()

        let frutasMaiusculas = frutas.map(function (p){
        return p.toUpperCase();
        });

        if (frutasMaiusculas.includes(fruta)){
            alert(`Fruta foi retirada da lista`)
            let indice = frutasMaiusculas.indexOf(fruta)
            frutas.splice(indice, 1)
        }
        else{
            alert(`Fruta indisponível no nosso mercado`)
        }

        if (frutas.length == 0){
            alert(`Lista de compras finalizada!`)
            break
        }

        let resposta = prompt(`Deseja uma nova fruta? SIM | PARE`).toLocaleUpperCase().trim()

        while(resposta != "SIM" && resposta != "PARE"){
            alert(`Digite apenas SIM ou PARE`)
            resposta = prompt(`Deseja uma nova fruta? SIM | PARE`).toLocaleUpperCase().trim()
        }

        if (resposta == "PARE"){
            break
        }

    }

    alert(`Obrigado por comprar em nossa loja! `)

</script>
<body>
    
</body>
</html>
