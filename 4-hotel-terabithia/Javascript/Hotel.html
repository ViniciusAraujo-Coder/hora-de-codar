<html>

<head>

	<script>
		let usuario;
		let hospedes = []

		function inicio() {

            var escolha = parseInt(prompt(`
🏨 HOTEL AURORA\n 
Selecione uma opção:\n
[1] 🛏️ Reserva de Quartos
[2] 👤 Cadastro de Hóspedes
[3] 🎉 Eventos
[4] ❄️ Ar-Condicionado
[5] ⛽ Abastecimento
[6] 📊 Relatórios Operacionais
[7] 🚪 Sair`));

			switch(escolha){
				case 1:
					reserva_quartos();
					break;
				case 2:
					cadastro_hospedes();
					break;
				case 3:
					eventos();
					break;
				case 4:
					arCondcionado();
					break;
				case 5:
					abastecer_carros();
					break;
				case 6:
					relatorios();
					break;	
				case 7:
					sair();
					break;
				default:
					erro();
					break
			}
		}


		function login(){
			alert(`🏨 Bem-vindo ao Hotel Aurora!`);
			usuario = prompt(`👋 Digite seu nome`);

			if (usuario == ""){
				while(!usuario != ""){
					alert(`Por favor informe um nome!`)
					usuario = prompt(`👋 Digite seu nome`);
				}
			}

			let senha;
			let tentativas = 3;

			while (tentativas > 0){
				senha = parseInt(prompt(`🔑 Digite sua senha:`));

				if (senha == 123){
					alert(`🏨🔓 Bem-vindo ao Hotel Aurora, ${usuario}! É um imenso prazer ter você por aqui!`);
            		inicio();
            		return;
				}

				tentativas--;

				if (tentativas > 0){
					alert(`🔒 Senha errada! Você ainda tem ${tentativas} tentativa(s).`);
				}
				
				else{
					alert(`🔒 Tentativas excedidas!`);
				}

			}


		}

		function reserva_quartos() {
			alert('🏨 HOTEL AURORA - RESERVA DE QUARTOS');

			let valorDiaria = parseFloat(prompt(`Informe o valor da diária: `));

			while(isNaN(valorDiaria)){
				alert(`Por favor informe o valor da diária.`)
				valorDiaria = parseFloat(prompt(`Informe o valor da diária: `));
			}

			let quantidadeDias = parseInt(prompt(`Ìnforme a quantidade de diárias (1-30):`))

			while(isNaN(quantidadeDias) || quantidadeDias < 1 || quantidadeDias > 30 ){
				alert(`Valor inválido, ${usuario}. Digite a quantidade de dias entre 1 a 30.`)
				quantidadeDias = parseInt(prompt(`Ìnforme a quantidade de diárias (1-30):`))
			}

			let nomeHospede = prompt(`Informe o nome do hóspede: `)

			let tipoQuarto = prompt(`Tipo de quarto (S/E/L): `)

			let numeroQuarto = parseInt(`Escolha um quarto (1-20): `)
			inicio();
		}

		function cadastro_hospedes() {
			alert('🏨 HOTEL AURORA - CADASTRO DE HÓSPEDES');
			inicio();
		}

		function abastecer_carros() {
			alert(' HOTEL AURORA - ABASTECER');
			inicio();
		}

		function erro() {
			alert('Por favor, informe um número entre 1 e 7');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				window.close();
			} else {
				inicio();
			}
		}

		
		
		login();
	</script>
</head>

</body>

</html>
