<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bichinho Virtual</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Bichinho Virtual</h1>

        <h2 id="nomePet">Meu pet</h2>

        <img id ="img" src="pet.jpg" alt="Imagem do pet">

        <div class="status">
            <p>🍗 Fome: <span id="fome">--</span></p>
            <p>🌱 Felicidade: <span id="felicidade">--</span></p>
            <p>😴 Cansaço: <span id="cansaco">--</span></p>
            <p>💩 Sujeira: <span id="sujeira">--</span></p>
            <p>🎈 Idade: <span id="idade">--</span></p>
        </div>

        <div class="botoes">
            <button id="alimentar">Alimentar</button>
            <button id="brincar">Brincar</button>
            <button id="descansar">Descansar</button>
            <button id="darBanho">Dar Banho</button>
        </div>

    </div>

    <script src="BichinhoVirtual.js"></script>

</body>

</html>
